# Netlify configuration — PyDrill is a fully static single-page app.
# The curriculum is bundled as JSON and grading runs in the browser, so there is
# no backend, no API proxy and no serverless function to deploy.

[build]
  base            = "frontend"
  command         = "npm ci && npm run build"
  publish         = "dist"

[build.environment]
  NODE_VERSION    = "20"
  NPM_FLAGS       = "--no-audit --no-fund"

# SPA fallback: every client-side route (#/week/5, #/drill/w05-01 etc.) is
# handled by index.html. Hash routing means deep links still resolve, and this
# also covers anyone hitting a path directly.
[[redirects]]
  from = "/*"
  to   = "/index.html"
  status = 200

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

# Deploy previews and branch deploys run the same static build.
[context.deploy-preview]
  command = "npm ci && npm run build"

[context.branch-deploy]
  command = "npm ci && npm run build"
